# UTM traffic capture. Installed on rv415 at /etc/nginx/conf.d/00-utm-traffic.conf.
# http context. One JSON line per GET/HEAD request that carries a utm_source arg (any host).
# No IP addresses are logged. Read by Alloy (-> Loki, app="utm") and the admin panel.
# Gotcha: a server-level access_log replaces the http-level ones, so a vhost that declares
# its own access_log (willis-brown.com) must also repeat the line:
#   access_log /var/log/nginx/utm-traffic.json utm_traffic if=$utm_hit;

map "$request_method|$arg_utm_source" $utm_hit {
    default 0;
    "~^(GET|HEAD)\|.+" 1;
}

log_format utm_traffic escape=json
    '{"ts":"$time_iso8601","host":"$host","uri":"$uri","status":"$status","src":"$arg_utm_source","med":"$arg_utm_medium","cmp":"$arg_utm_campaign","cnt":"$arg_utm_content","ref":"$http_referer","ua":"$http_user_agent","country":"$http_cf_ipcountry","method":"$request_method"}';

access_log /var/log/nginx/utm-traffic.json utm_traffic if=$utm_hit;
