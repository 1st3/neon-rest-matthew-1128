name: Deploy to RV415

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-news-dieppe-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Test & Deploy to RV415
    runs-on: [self-hosted, rv415, 1st3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit and manifest test suite
        run: node --test

      - name: Deploy files to rv415 web directory
        run: |
          mkdir -p /home/ds/sites/news.dieppe.app
          rsync -av --delete \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules' \
            --exclude='art' \
            --exclude='scripts' \
            --exclude='test' \
            --exclude='package.json' \
            --exclude='README.md' \
            ./ /home/ds/sites/news.dieppe.app/
          chmod -R o+rX /home/ds/sites/news.dieppe.app

      - name: Verify local Nginx serving
        run: |
          curl -f -sI -H "Host: news.dieppe.app" http://127.0.0.1:80/ | head -n 5
          curl -f -sI -H "Host: news.dieppe.app" http://127.0.0.1:80/site.webmanifest | grep -i "application/manifest+json"
          curl -f -sI -H "Host: news.dieppe.app" http://127.0.0.1:80/sw.js | head -n 5
          curl -f -sI -H "Host: news.dieppe.app" http://127.0.0.1:80/verses.json | grep -i "X-Robots-Tag: noindex"
          curl -f -sI -H "Host: news.dieppe.app" http://127.0.0.1:80/og-image.png | grep -i "image/png"
          curl -f -sI -H "Host: news.dieppe.app" http://127.0.0.1:80/robots.txt | grep -i "text/plain"
          curl -f -sI -H "Host: news.dieppe.app" http://127.0.0.1:80/sitemap.xml | grep -i "xml"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: news.dieppe.app' http://127.0.0.1:80/this-does-not-exist)" = "404"

      - name: Purge Cloudflare edge cache
        run: |
          if [ -f /home/ds/dev/.cloudflare_global_email ] && [ -f /home/ds/dev/.cloudflare_global_token ]; then
            curl -f -s -X POST "https://api.cloudflare.com/client/v4/zones/4f9661d0cf0ed7b9a3a24a0306abc573/purge_cache" \
              -H "X-Auth-Email: $(cat /home/ds/dev/.cloudflare_global_email)" \
              -H "X-Auth-Key: $(cat /home/ds/dev/.cloudflare_global_token)" \
              -H "Content-Type: application/json" \
              --data '{"files":["https://news.dieppe.app/","https://news.dieppe.app/index.html","https://news.dieppe.app/404.html","https://news.dieppe.app/neon.js","https://news.dieppe.app/styles.css","https://news.dieppe.app/sw.js","https://news.dieppe.app/verses.json","https://news.dieppe.app/og-image.png","https://news.dieppe.app/robots.txt","https://news.dieppe.app/sitemap.xml","https://news.dieppe.app/site.webmanifest","https://news.dieppe.app/manifest.webmanifest"]}'
          fi
